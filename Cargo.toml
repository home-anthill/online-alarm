[package]
name = "ks89-alarm-notifier"
version = "4.0.0"
edition = "2024"
resolver = "3"

[[bin]]
name = "alarm-notifier"
path = "src/main.rs"

[lib]
name = "alarm_notifier"
path = "src/lib.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"

[dependencies]
rocket = { version = "^0.5.1", features = ["uuid", "secrets", "json"] }
tokio = { version = "^1.53.1", features = ["full"] }
redis = { version = "^1.4.1", features = ["tokio-comp", "connection-manager", "aio", "ahash", "r2d2"] }
futures = "^0.3.33"
dashmap = "^6.2.1"
google-fcm1 = { version = "^7.0.0", features = ["yup-oauth2-service-account"] }
urlencoding = "^2.1.3"
# error handling
thiserror = "2.0.19"
anyhow = "^1.0.104"
# logger
tracing = "^0.1.44"
tracing-appender = "^0.2.5"
tracing-subscriber = { version = "^0.3.23", features = ["env-filter"] }
# env vars
dotenvy = "^0.15.7"
envy = "^0.4.2"

# To use Serialize and Deserialize traits, you must include Serde.
# The "derive" feature is only required when
# using #[derive(Serialize, Deserialize)] to make Serde work with structs
# and enums defined in your crate.
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "^1.0.151"

[dev-dependencies]
# better looking rust assertions
pretty_assertions = "^1.4.1"
test-log = {version = "^0.2.21", features = ["trace"]}
