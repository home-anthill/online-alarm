[package]
name = "ks89-online-alarm"
version = "3.0.0"
edition = "2024"
resolver = "3"

[[bin]]
name = "online"
path = "src/main.rs"

[lib]
name = "online"
path = "src/lib.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"

[dependencies]
rocket = { version = "^0.5.1", features = ["uuid", "secrets", "json"] }
tokio = { version = "^1.50.0", features = ["full"] }
redis = { version = "^1.0.5", features = ["tokio-comp", "connection-manager", "aio", "ahash", "r2d2"] }
futures = "^0.3.32"
dashmap = "^6.1.0"
fcm-rs = "^0.2.0"
urlencoding = "^2.1.3"
# error handling
thiserror = "2.0.18"
anyhow = "^1.0.102"
# logger
tracing = "^0.1.44"
tracing-appender = "^0.2.4"
tracing-subscriber = { version = "^0.3.23", features = ["env-filter"] }
# env vars
dotenvy = "^0.15.7"
envy = "^0.4.2"

# To use Serialize and Deserialize traits, you must include Serde.
# The "derive" feature is only required when
# using #[derive(Serialize, Deserialize)] to make Serde work with structs
# and enums defined in your crate.
serde = { version = "^1.0.228", features = ["derive"] }
serde_json = "^1.0.149"

[dev-dependencies]
# better looking rust assertions
pretty_assertions = "^1.4.1"
# include also serde_json with the feature 'preserve_order' to don't change the order of keys
# 'preserve_order' is required to compare results in a predictible way in testing
serde_json = { version = "^1.0.149", features = ["preserve_order"] }
test-log = {version = "^0.2.19", features = ["trace"]}