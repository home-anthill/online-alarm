[package]
name = "ks89-online-alarm"
version = "1.0.0"
edition = "2024"
resolver = "3"

[[bin]]
name = "online"
path = "src/main.rs"

[lib]
name = "online"
path = "src/lib.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"

[dependencies]
thiserror = "2.0.16"
anyhow = "1.0.99"
rocket = { version = "0.5.1", features = ["uuid", "secrets", "json"] }
tokio = { version = "^1.47.1", features = ["full"] }
redis = { version = "^0.32.5", features = ["tokio-comp", "connection-manager", "aio", "ahash", "r2d2", "safe_iterators"] }
tracing = "^0.1.41"
tracing-appender = "^0.2.3"
tracing-subscriber = { version = "^0.3.20", features = ["env-filter"] }
dotenvy = "^0.15.7"
envy = "^0.4.2"
futures = "^0.3.31"
dashmap = "^6.1.0"
fcm-rs = "^0.2.0"

# To use Serialize and Deserialize traits, you must include Serde.
# The "derive" feature is only required when
# using #[derive(Serialize, Deserialize)] to make Serde work with structs
# and enums defined in your crate.
serde = { version = "^1.0.219", features = ["derive"] }
serde_json = "^1.0.143"

[dev-dependencies]
# better looking rust assertions
pretty_assertions = "^1.4.1"
# include also serde_json with the feature 'preserve_order' to don't change the order of keys
# 'preserve_order' is required to compare results in a predictible way in testing
serde_json = { version = "^1.0.143", features = ["preserve_order"] }
